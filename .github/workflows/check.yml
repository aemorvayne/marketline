name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.1
      - uses: browser-actions/setup-chrome@v2.2.0
      - run: mise run setup
      - run: mise run check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-and-browser-artifacts
          path: |
            coverage/
            tmp/screenshots/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t marketline .
      - run: docker run --detach --name marketline --publish 9292:9292 --env PORT=9292 marketline
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:9292/health
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:9292/
      - run: docker logs marketline
        if: always()
      - run: docker rm --force marketline
        if: always()
