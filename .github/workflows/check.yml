name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run setup
      - run: mise run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-browser-artifacts
          path: |
            coverage/
            tmp/screenshots/
          if-no-files-found: ignore
